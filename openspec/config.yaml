rules:
  proposal:
    - "Mantener PLAN.md como contexto de negocio y declarar explícitamente cualquier cambio de alcance."
    - "Incluir riesgos de datos, rollback y protección de la presentación original."
  specs:
    - "Redactar requisitos y escenarios en español neutral con términos RFC 2119."
    - "Cubrir cardinalidad exacta, reconciliación, casos borde, idempotencia y cero filas huérfanas."
    - "Distinguir datos reales, proyectados y manuales, incluyendo fuente, corte y evidencia."
  design:
    - "Documentar límites entre extracción, validación, snapshot, render, aprobación y publicación."
    - "Incluir trazabilidad por run_id, attempt_id, manifiestos, hashes y bundle canónico."
    - "Diseñar la publicación únicamente sobre una copia temporal de Google Slides."
  tasks:
    - "Agrupar por fase y usar numeración jerárquica."
    - "Mantener cada tarea verificable y realizable en una sesión."
    - "Agregar primero la habilitación del entorno de pruebas antes de implementar lógica."
  apply:
    constraints:
      - "No implementar sin especificación y diseño aprobados."
      - "Cuando exista un test runner, aplicar RED-GREEN-REFACTOR sin modificar pruebas para forzar pases."
      - "No usar una fuente vacía como valor cero ni publicar ante discrepancias."
    tdd: false
    test_command: ""
  verify:
    constraints:
      - "Verificar los requisitos, el diseño, las tareas y las cinco obligaciones DQS."
      - "Verificar que Sheets y Slides compartan el mismo hash antes de aprobar publicación."
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - "Advertir antes de fusionar deltas destructivos."
    - "Conservar el archivo como pista de auditoría inmutable."
