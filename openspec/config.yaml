schema: spec-driven
language: en
project: "Script Consejo 2026"
persistence: hybrid
strict_tdd: true

context: |
  Purpose: automate generation, validation, and publication of the 2026 council presentation.
  Stack: Python 3.11+, PostgreSQL, PyYAML, Click, Google Sheets/Slides APIs, and a local JSON-RPC MCP proxy.
  Architecture: Clean Architecture with pure domain, application ports/use cases, external adapters, and manual dependency injection.
  Flow: catalog-driven extraction, blocking DQS validation, canonical UTF-8 bundle, SHA-256 traceability, and idempotent Sheets snapshot.
  Safety: empty sources are not zero; discrepancies block publication; Google Slides writes remain outside the current change.
  Traceability: run_id, attempt_id, source manifests, catalog hash, and canonical bundle hash.

testing:
  detected_on: "2026-08-04"
  strict_tdd: true
  strict_tdd_reason: "pytest is configured and 161 unit, integration, and E2E tests are collectable."
  runner:
    available: true
    framework: pytest
    command: "python3 -m pytest"
  layers:
    unit:
      available: true
      tool: pytest
      command: "python3 -m pytest tests/unit -v"
    integration:
      available: true
      tool: pytest
      command: "python3 -m pytest tests/integration -v"
    e2e:
      available: true
      tool: pytest
      command: "python3 -m pytest tests/e2e -v"
  coverage:
    available: true
    tool: pytest-cov
    command: "python3 -m pytest --cov=src/consejo --cov-report=term-missing"
  quality_tools:
    linter:
      available: false
      command: null
    type_checker:
      available: false
      command: null
    formatter:
      available: false
      command: null

rules:
  proposal:
    - "Keep PLAN.md as business context and declare scope changes explicitly."
    - "Include data risks, rollback, and protection of the original presentation."
  specs:
    - "Use RFC 2119 keywords and Given/When/Then scenarios."
    - "Cover exact grain cardinality, reconciliation, real edge cases, destructive idempotency, and zero orphan rows."
    - "Distinguish observed, projected, and manual data, including source, cutoff, and evidence."
  design:
    - "Document boundaries between extraction, validation, snapshot, rendering, approval, and publication."
    - "Preserve run_id, attempt_id, manifests, hashes, and the canonical bundle."
    - "Allow publication only against a temporary copy of Google Slides."
  tasks:
    - "Group tasks by phase and use hierarchical numbering."
    - "Keep each task verifiable and completable in one session."
    - "Add or update tests before implementation changes."
  apply:
    constraints:
      - "Do not implement without approved specifications and design."
      - "Apply RED-GREEN-REFACTOR and never alter tests merely to force a pass."
      - "Never treat an empty source as zero or publish when reconciliation fails."
    tdd: true
    test_command: "python3 -m pytest"
  verify:
    constraints:
      - "Verify requirements, design, tasks, and all five DQS obligations."
      - "Verify that Sheets and Slides share the same hash before any publication approval."
    test_command: "python3 -m pytest"
    build_command: ""
    coverage_threshold: 0
  archive:
    - "Warn before merging destructive deltas."
    - "Preserve archived changes as an immutable audit trail."
