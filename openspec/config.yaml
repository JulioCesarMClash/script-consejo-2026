schema: spec-driven
language: es-neutral
project: "Script Consejo 2026"
persistence: hybrid
strict_tdd: false

context: |
  Objetivo: automatizar la generación, validación y publicación de la presentación del consejo 2026.
  Estado: repositorio inicial con PLAN.md y README.md; todavía no existe código ni estructura de aplicación.
  Stack previsto: Python ETL, PostgreSQL remoto, MySQL local:8889, Google Sheets, Apps Script y Google Slides.
  Flujo: extracción, validación DQS, snapshot, revisión maker-checker, publicación sobre copia y verificación final.
  Trazabilidad: run_id, attempt_id, bundle canónico UTF-8 y hash SHA-256.
  Datos: PostgreSQL es la fuente principal; MySQL y entradas manuales son fuentes temporales o autorizadas.
  Arquitectura: flujo por fases definido; la arquitectura de código aún no está decidida ni implementada.
  Calidad: publicación bloqueada ante discrepancias, fuentes vacías no equivalen a cero y la reejecución no debe duplicar datos.

testing:
  detected_on: "2026-07-30"
  strict_tdd: false
  strict_tdd_reason: "No se detectó código, configuración de dependencias ni test runner ejecutable."
