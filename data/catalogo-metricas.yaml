platforms:
- id: 1
  name: Capacitate
  alias: CPE
  description: Plataforma Capacitate para el Empleo (Fundación Carlos Slim)
- id: 2
  name: Aprende
  description: Plataforma Aprende
metrics:
- key: registered_cpe
  name: Registrados CPE
  description: Usuarios que generaron una cuenta con correo en la plataforma CPE.
  formula: COUNT(DISTINCT dim_user.userId) WHERE dim_user.plataformaId = 1
  type: count_distinct
  source: dim_user
  platform_scope:
  - cpe
  db_mapping: 'SELECT COUNT(DISTINCT "userId") FROM dim_user WHERE "plataformaId" = 1

    '
  athena_mapping: 'SELECT COUNT(DISTINCT user_id) AS value FROM dim_user WHERE plataforma_id = 1

    '
  caveats: []
- key: registered_aprende
  name: Registrados Aprende
  description: Usuarios que generaron una cuenta con correo en la plataforma Aprende.
  formula: COUNT(DISTINCT dim_user.userId) WHERE dim_user.plataformaId = 2
  type: count_distinct
  source: dim_user
  platform_scope:
  - aprende
  db_mapping: 'SELECT COUNT(DISTINCT "userId") FROM dim_user WHERE "plataformaId" = 2

    '
  caveats: []
- key: registered_total
  name: Registrados totales CPE+Aprende
  description: Suma de registrados en CPE más registrados en Aprende.
  formula: registered_cpe + registered_aprende
  type: sum
  source: dim_user
  platform_scope:
  - cpe
  - aprende
  db_mapping: 'Registrados CPE + Registrados Aprende

    '
  caveats: []
- key: beneficiaries
  name: Beneficiarios
  description: 'Usuarios registrados en CPE + Inscritos únicos CPE desde Aprende. Mide el alcance combinado de ambas plataformas.

    '
  formula: 'registered_cpe + inscritos_unicos_cpe_desde_aprende (calculado con DISTINCT directo sobre fact_inscription, no
    desde agregadas)

    '
  type: count_distinct
  source: fact_inscription
  platform_scope:
  - cpe
  - aprende
  db_mapping: "SELECT (\n  (SELECT COUNT(DISTINCT \"userId\") FROM dim_user WHERE \"plataformaId\" = 1)\n  +\n  (SELECT COUNT(DISTINCT\
    \ fi.\"userId\")\n   FROM fact_inscription fi\n   JOIN course c ON c.\"id\" = fi.\"courseId\"\n   JOIN dim_user du ON\
    \ du.\"userId\" = fi.\"userId\"\n   WHERE c.\"platformId\" = 1 AND du.\"plataformaId\" = 2)\n)\n"
  caveats:
  - No usar tablas agregadas (agg_*). Se calcula con DISTINCT directo sobre fact_inscription.
  - 'Derivada: se calcula automáticamente como suma de registered_cpe + inscribed_unique_cpe_from_aprende (según su fórmula).'
- key: inscriptions_cpe
  name: Inscripciones CPE
  description: 'Inscripciones en cursos de CPE realizadas por usuarios de CPE (plataformaId = 1). Puede incluir más de una
    inscripción por usuario.

    '
  formula: 'COUNT(*) FROM fact_inscription JOIN course ON course.platformId = 1 JOIN dim_user ON dim_user.userId = fact_inscription.userId
    AND dim_user.plataformaId = 1

    '
  type: count
  source: fact_inscription
  platform_scope:
  - cpe
  db_mapping: 'SELECT COUNT(*) FROM fact_inscription fi JOIN course c ON c."id" = fi."courseId" JOIN dim_user du ON du."userId"
    = fi."userId" WHERE c."platformId" = 1 AND du."plataformaId" = 1

    '
  athena_mapping: "SELECT COUNT(*) AS value FROM fact_inscription fi\n  JOIN course c ON c.course_id = fi.course_id\n  JOIN dim_user du ON du.user_id = fi.user_id\n  WHERE c.platform_id = 1 AND du.plataforma_id = 1\n"
  caveats:
  - No usa tablas agregadas (agg_*). Consulta directa a fact_inscription.
  - 'Particionada por plataforma de usuario: inscriptions_cpe_total = inscriptions_cpe + inscriptions_cpe_from_aprende.'
- key: inscriptions_cpe_from_aprende
  name: Inscripciones CPE desde Aprende
  description: 'Total de inscripciones realizadas en cursos de CPE por usuarios de Aprende. Puede incluir más de una inscripción
    por usuario.

    '
  formula: 'COUNT(*) FROM fact_inscription JOIN course ON course.platformId = 1 JOIN dim_user ON dim_user.userId = fact_inscription.userId
    AND dim_user.plataformaId = 2

    '
  type: count
  source: fact_inscription
  platform_scope:
  - cpe
  db_mapping: 'SELECT COUNT(*) FROM fact_inscription fi JOIN course c ON c."id" = fi."courseId" JOIN dim_user du ON du."userId"
    = fi."userId" WHERE c."platformId" = 1 AND du."plataformaId" = 2

    '
  caveats:
  - Mide usuarios Aprende consumiendo contenido CPE.
  - No usa tablas agregadas (agg_*). Consulta directa a fact_inscription.
- key: inscriptions_cpe_total
  name: Inscripciones totales CPE
  description: 'Total de inscripciones en cursos de CPE (desde CPE y desde Aprende). Incluye más de una inscripción por usuario.

    '
  formula: inscriptions_cpe + inscriptions_cpe_from_aprende
  type: sum
  source: fact_inscription
  platform_scope:
  - cpe
  db_mapping: Inscripciones CPE + Inscripciones CPE desde Aprende
  caveats:
  - No usa tablas agregadas (agg_*). Consulta directa a fact_inscription.
  - Partes disjuntas por plataforma de usuario (1 y 2); la suma iguala el total.
- key: inscribed_unique_cpe
  name: Inscritos únicos CPE
  description: Usuarios únicos inscritos en al menos un curso de CPE.
  formula: 'COUNT(DISTINCT fact_inscription.userId) JOIN course ON course.platformId = 1 JOIN dim_user ON dim_user.plataformaId
    = 1

    '
  type: count_distinct
  source: fact_inscription
  platform_scope:
  - cpe
  db_mapping: 'SELECT COUNT(DISTINCT fi."userId") FROM fact_inscription fi JOIN course c ON c."id" = fi."courseId" JOIN dim_user
    du ON du."userId" = fi."userId" WHERE c."platformId" = 1 AND du."plataformaId" = 1

    '
  caveats:
  - No usa tablas agregadas (agg_*). Consulta directa a fact_inscription.
- key: inscribed_unique_cpe_from_aprende
  name: Inscritos únicos CPE desde Aprende
  description: Usuarios únicos inscritos en al menos un curso de CPE desde Aprende.
  formula: 'COUNT(DISTINCT fact_inscription.userId) JOIN course ON course.platformId = 1 JOIN dim_user ON dim_user.plataformaId
    = 2

    '
  type: count_distinct
  source: fact_inscription
  platform_scope:
  - cpe
  db_mapping: 'SELECT COUNT(DISTINCT fi."userId") FROM fact_inscription fi JOIN course c ON c."id" = fi."courseId" JOIN dim_user
    du ON du."userId" = fi."userId" WHERE c."platformId" = 1 AND du."plataformaId" = 2

    '
  caveats:
  - Usuarios de Aprende que se inscribieron en cursos CPE.
- key: beneficiaries_unique
  name: Beneficiarios únicos
  description: 'Inscritos únicos CPE + Inscritos únicos CPE desde Aprende. Representa el total de personas alcanzadas por
    cursos CPE.

    '
  formula: 'inscribed_unique_cpe + inscribed_unique_cpe_from_aprende (calculado con DISTINCT directo sobre fact_inscription,
    no desde agregadas)

    '
  type: sum
  source: fact_inscription
  platform_scope:
  - cpe
  - aprende
  db_mapping: 'Inscritos únicos CPE + Inscritos únicos CPE desde Aprende

    '
  caveats:
  - Se calcula automáticamente como suma de inscritos únicos por origen.
- key: certifications_cpe
  name: Certificados CPE
  description: 'Total de certificados emitidos en CPE. Incluye más de un certificado por usuario. Regla: certificationDate
    IS NOT NULL AND advance = 100.

    '
  formula: 'COUNT(*) FROM fact_inscription JOIN course ON course.platformId = 1 JOIN dim_user ON dim_user.plataformaId = 1
    WHERE advance = 100 AND certificationDate IS NOT NULL

    '
  type: count
  source: fact_inscription
  platform_scope:
  - cpe
  db_mapping: "SELECT COUNT(*) FROM fact_inscription fi JOIN course c ON c.\"id\" = fi.\"courseId\" JOIN dim_user du ON du.\"\
    userId\" = fi.\"userId\" WHERE c.\"platformId\" = 1\n  AND du.\"plataformaId\" = 1\n  AND fi.\"advance\" = 100\n  AND\
    \ fi.\"certificationDate\" IS NOT NULL\n  AND fi.\"certificationDate\" >= %(period_start)s\n  AND fi.\"certificationDate\"\
    \ < %(period_end)s\n"
  caveats:
  - Requiere advance = 100 AND certificationDate IS NOT NULL. Usar solo certificationDate sobrecuenta.
  - No usa tablas agregadas (agg_*). Consulta directa a fact_inscription.
- key: certifications_cpe_from_aprende
  name: Certificados CPE desde Aprende
  description: 'Total de certificados emitidos en CPE a usuarios de Aprende. Incluye más de un certificado por usuario. Regla:
    certificationDate IS NOT NULL AND advance = 100.

    '
  formula: 'COUNT(*) FROM fact_inscription JOIN course ON course.platformId = 1 JOIN dim_user ON dim_user.plataformaId = 2
    WHERE advance = 100 AND certificationDate IS NOT NULL

    '
  type: count
  source: fact_inscription
  platform_scope:
  - cpe
  db_mapping: "SELECT COUNT(*) FROM fact_inscription fi JOIN course c ON c.\"id\" = fi.\"courseId\" JOIN dim_user du ON du.\"\
    userId\" = fi.\"userId\" WHERE c.\"platformId\" = 1\n  AND du.\"plataformaId\" = 2\n  AND fi.\"advance\" = 100\n  AND\
    \ fi.\"certificationDate\" IS NOT NULL\n  AND fi.\"certificationDate\" >= %(period_start)s\n  AND fi.\"certificationDate\"\
    \ < %(period_end)s\n"
  caveats:
  - Requiere advance = 100 AND certificationDate IS NOT NULL.
  - No usa tablas agregadas (agg_*). Consulta directa a fact_inscription.
- key: certifications_cpe_total
  name: Certificados totales CPE
  description: 'Total de certificados emitidos en CPE + certificados CPE desde Aprende. Incluye más de un certificado por
    usuario.

    '
  formula: certifications_cpe + certifications_cpe_from_aprende
  type: sum
  source: fact_inscription
  platform_scope:
  - cpe
  db_mapping: Certificados CPE + Certificados CPE desde Aprende
  caveats:
  - No usa tablas agregadas (agg_*). Consulta directa a fact_inscription.
- key: certified_unique_cpe
  name: Certificados únicos CPE
  description: 'Usuarios que han terminado al menos un curso en CPE. Regla: certificationDate IS NOT NULL AND advance = 100.

    '
  formula: 'COUNT(DISTINCT fact_inscription.userId) JOIN course ON course.platformId = 1 JOIN dim_user ON dim_user.plataformaId
    = 1 WHERE advance = 100 AND certificationDate IS NOT NULL

    '
  type: count_distinct
  source: fact_inscription
  platform_scope:
  - cpe
  db_mapping: "SELECT COUNT(DISTINCT fi.\"userId\") FROM fact_inscription fi JOIN course c ON c.\"id\" = fi.\"courseId\" JOIN\
    \ dim_user du ON du.\"userId\" = fi.\"userId\" WHERE c.\"platformId\" = 1\n  AND du.\"plataformaId\" = 1\n  AND fi.\"\
    advance\" = 100\n  AND fi.\"certificationDate\" IS NOT NULL\n"
  caveats:
  - Requiere advance = 100 AND certificationDate IS NOT NULL.
  - No usa tablas agregadas (agg_*). Consulta directa a fact_inscription.
- key: certified_unique_cpe_from_aprende
  name: Certificados únicos CPE desde Aprende
  description: 'Usuarios que han terminado al menos un curso en CPE desde Aprende. Regla: certificationDate IS NOT NULL AND
    advance = 100.

    '
  formula: 'COUNT(DISTINCT fact_inscription.userId) JOIN course ON course.platformId = 1 JOIN dim_user ON dim_user.plataformaId
    = 2 WHERE advance = 100 AND certificationDate IS NOT NULL

    '
  type: count_distinct
  source: fact_inscription
  platform_scope:
  - cpe
  db_mapping: "SELECT COUNT(DISTINCT fi.\"userId\") FROM fact_inscription fi JOIN course c ON c.\"id\" = fi.\"courseId\" JOIN\
    \ dim_user du ON du.\"userId\" = fi.\"userId\" WHERE c.\"platformId\" = 1\n  AND du.\"plataformaId\" = 2\n  AND fi.\"\
    advance\" = 100\n  AND fi.\"certificationDate\" IS NOT NULL\n"
  caveats:
  - Usuarios de Aprende que certificaron cursos CPE.
  - No usa tablas agregadas (agg_*). Consulta directa a fact_inscription.
- key: certified_unique_cpe_total
  name: Certificados únicos totales CPE
  description: 'Total de usuarios que han terminado al menos un curso en CPE (global y desde Aprende).

    '
  formula: certified_unique_cpe + certified_unique_cpe_from_aprende
  type: sum
  source: fact_inscription
  platform_scope:
  - cpe
  - aprende
  db_mapping: Certificados únicos CPE + Certificados únicos CPE desde Aprende
  caveats:
  - No incluye tablas agregadas (agg_*). Consulta directa a fact_inscription.
- key: slide1_herramientas_pobreza
  name: Certificados por categoría — herramientas contra la pobreza (Slide 1)
  description: 'Personas certificadas en las 6 categorías de la slide 1 (114 cursos). Distribución declarada por el usuario
    el 2026-10-06. Grano por categoría: COUNT(DISTINCT userId) dentro de los cursos de cada una, así que quien certifica en
    dos categorías cuenta en las dos y el TOTAL de la hoja (=SUM) no son personas únicas. Regla: advance = 100, período oficial
    de certificados, plataforma 1 o 2, México.'
  formula: COUNT(DISTINCT fact_inscription.userId) POR CATEGORÍA en las 6 categorías, WHERE advance = 100 AND certificationDate
    en período AND plataformaId IN (1,2) AND Mexico.
  type: count_distinct
  source: fact_inscription
  platform_scope: &id001
  - cpe
  - aprende
  reconcile_column: certificados
  db_mapping: "WITH categorias AS (\n  SELECT * FROM (VALUES\n  (1, 'slide1_vivienda',\n   ARRAY[9,187,4,389,390,367,11,205,206,30,140,23,29,24,12,100157,244,240,27]::bigint[],\
    \ 0),\n  (2, 'slide1_digital',\n   ARRAY[254,399,213,258,285,379,43,321,374,375,100002,100006,394,380,100003,345,100897,368,372,100129,373]::bigint[],\
    \ 0),\n  (3, 'slide1_alimentos',\n   ARRAY[33,241,282,410,103,145,242,362,382,128,129,130,141,347,89,291,100147,100322,142,299,348,364,100900,100861,100918,100214]::bigint[],\
    \ 0),\n  (4, 'slide1_desastres',\n   ARRAY[57,95,120,276,281,314,342,354,387,393,100098]::bigint[], 0),\n  (5, 'slide1_autoempleo',\n\
    \   ARRAY[93,156,157,158,100092,100149,159,167,169,100105,106,107,117,153,100074,118,234,301,100101,100310,100320,143,170,320,343,358,100327,77]::bigint[],\
    \ 0),\n  (6, 'slide1_buscar_trabajo',\n   ARRAY[100919,100928,228,100853,216,227,67,212,100059]::bigint[], 0)\n) AS RECORDS(orden,\
    \ metric_id, categoria_ids, compartidos) ) SELECT c.metric_id,\n       'fact_inscription' AS source,\n       array_length(c.categoria_ids,\
    \ 1) AS value,\n       c.compartidos,\n       array_length(c.categoria_ids, 1) + c.compartidos AS cursos_totales,\n  \
    \     (SELECT COUNT(DISTINCT fi.\"userId\")\n         FROM fact_inscription fi\n         JOIN dim_user u ON u.\"userId\"\
    \ = fi.\"userId\"\n         JOIN dim_local l ON l.\"localId\" = u.\"localId\"\n         WHERE fi.\"courseId\" = ANY(c.categoria_ids)\n\
    \           AND fi.advance = 100\n           AND fi.\"certificationDate\" >= %(period_start)s\n           AND fi.\"certificationDate\"\
    \ < %(period_end)s\n           AND u.\"plataformaId\" IN (1,2)\n           AND l.\"countryName\" = 'México'\n        )\
    \ AS certificados,\n       %(period_start)s AS periodo_inicio,\n       %(period_end)s AS periodo_fin\nFROM categorias\
    \ c ORDER BY c.orden\n"
  athena_mapping: |
    WITH categorias AS (
      SELECT * FROM (VALUES
      (1, 'slide1_vivienda',
       ARRAY[9,187,4,389,390,367,11,205,206,30,140,23,29,24,12,100157,244,240,27], 0),
      (2, 'slide1_digital',
       ARRAY[254,399,213,258,285,379,43,321,374,375,100002,100006,394,380,100003,345,100897,368,372,100129,373], 0),
      (3, 'slide1_alimentos',
       ARRAY[33,241,282,410,103,145,242,362,382,128,129,130,141,347,89,291,100147,100322,142,299,348,364,100900,100861,100918,100214], 0),
      (4, 'slide1_desastres',
       ARRAY[57,95,120,276,281,314,342,354,387,393,100098], 0),
      (5, 'slide1_autoempleo',
       ARRAY[93,156,157,158,100092,100149,159,167,169,100105,106,107,117,153,100074,118,234,301,100101,100310,100320,143,170,320,343,358,100327,77], 0),
      (6, 'slide1_buscar_trabajo',
       ARRAY[100919,100928,228,100853,216,227,67,212,100059], 0)
    ) AS RECORDS(orden, metric_id, categoria_ids, compartidos) )
    SELECT c.metric_id,
           'fact_inscription' AS source,
           cardinality(c.categoria_ids) AS value,
           c.compartidos,
           cardinality(c.categoria_ids) + c.compartidos AS cursos_totales,
           (SELECT COUNT(DISTINCT fi.user_id)
             FROM fact_inscription fi
             JOIN dim_user u ON u.user_id = fi.user_id
             WHERE contains(c.categoria_ids, fi.course_id)
               AND fi.advance = 100
               AND fi.certification_date >= date(%(period_start)s)
               AND fi.certification_date < date(%(period_end)s)
               AND u.plataforma_id IN (1,2)
               AND u.country_id = 'MX'
            ) AS certificados,
           %(period_start)s AS periodo_inicio,
           %(period_end)s AS periodo_fin
    FROM categorias c ORDER BY c.orden
  caveats:
  - 'Distribución declarada por el usuario el 2026-10-06: 6 categorías y 113 cursos. Etiquetas del deck por clave: slide1_vivienda
    = "Formación para mejorar tu vivienda" (19); slide1_digital = "Desarrollo de habilidades digitales básicas" (21); slide1_alimentos
    = "Alimentos desde casa, seguridad e higiene elemental" (26); slide1_desastres = "Formación para actuar ante desastres
    naturales" (11); slide1_autoempleo = "Crea tu propio empleo" (28); slide1_buscar_trabajo = "Activate para buscar trabajo"
    (9). La hoja publica la clave corta en su columna Categoría.'
  - 'La vieja `slide1_empleo` (26 cursos) se partió en dos: slide1_autoempleo y slide1_buscar_trabajo. Las otras 4 claves
    se conservan para que el histórico siga siendo legible.'
  - 'Columna `orden` nueva: la SQL ordenaba por `metric_id` y la hoja salía alfabética. Ahora `ORDER BY c.orden` respeta el
    orden de la lista del usuario (vivienda, digital, alimentos, desastres, autoempleo, buscar trabajo).'
  - 'Los `compartidos` quedaron en 0 en las 6 categorías. Antes eran 0/2/7/0/3 = 12 sobre 101 cursos en los arrays: el solapamiento
    se resolvía asignando cada curso a una categoría y los 12 restantes se declaraban como literal. La distribución nueva
    trae los cursos explícitos, así que no queda nada que declarar y la columna "Cursos totales" del deck se respalda por
    cursos reales.'
  - 'Reparto: 114 asignaciones sobre 114 cursos distintos, cero compartidos entre categorías.'
  - 'Entran 14 cursos respecto de la versión anterior: 67, 77, 205, 206, 212, 216, 227, 228, 100059, 100129, 100214, 100327,
    100853 y 100919. El 100129 (Manejo correcto de las tarjetas de crédito) vuelve al catálogo: había quedado afuera en el
    revert de la ruta "Compras y pagos digitales" (hallazgo H10).'
  - 'Salen 2 cursos ACTIVOS, no retirados: 100212 (Fundamentos de inteligencia artificial, 87,133 inscripciones) y 366 (Fundamentos
    de blockchain, 25,499), los que un caveat anterior llamaba "cursos IA". La exclusión es editorial.'
  - El curso 342 (Introducción a Primer Respondiente) sigue SOLO en desastres para no duplicar certificados; alimentos no
    lo incluye.
  - 'El curso 100928 (Busca tu primer trabajo) entró el 2026-10-09. Cuando se armó esta distribución el usuario lo listó SIN
    ID y pidió no contarlo, así que "Activate para buscar trabajo" quedó en 8 cursos; el ID se resolvió al pasar el layout
    de slide 12 y el deck ya declaraba 9. Verificado antes de agregarlo: NO mueve la cifra de certificados — con 8 o con 9
    cursos la categoría da 24,891 personas, porque los 4 certificados del 100928 caen fuera de la ventana o son de gente que
    ya certificó otro curso de la categoría.'
  - Excluye IDs 100433/100436 (sector 81) con 0 certificados/inscripciones en fact_inscription.
  - 'El total (cursos únicos y certificados) se compone en la hoja Slide 1 con fórmula =SUM, no en SQL. Como cada categoría
    es COUNT(DISTINCT) dentro de sus cursos, ese TOTAL NO son personas únicas: en la corrida del 2026-10-05 la suma daba 237,691
    contra 208,815 personas reales (+13.8%). Ver hallazgo H20.'
  - 'Certificación: advance = 100, período oficial de certificados vía %(period_start)s/%(period_end)s, plataforma 1 o 2,
    filtrado por México (l.countryName = ''México'' vía JOIN a dim_local).'
  - OBSOLETO — no usar como referencia. El TOTAL=352,206 registrado el 2026-08-17 se midió SIN el filtro de México y con 96
    cursos. Ver hallazgo H12.
  - 'ATENCIÓN con el conteo del deck: la slide física declara 19 cursos en "Desarrollo de habilidades digitales básicas" y
    el catálogo tiene 21. El 52,901 que publica el deck corresponde a los 21: medido el 2026-10-09, los 21 cursos aportan
    personas únicas (el menor es 380 con +159 y el mayor 213 con +13,404), así que ninguna combinación de 19 puede dar esa
    cifra. Los 2 de diferencia son probablemente 100129 (+1,635) y 373 (+510), que en slide 12 forman la ruta "Compras y pagos
    digitales". El conteo correcto es 21 y el total de la slide 114, no 112.'
- key: slide12_rutas_aprendizaje
  name: Rutas de aprendizaje (Slide 12)
  description: 'Tabla slide 12: 18 rutas de aprendizaje en 4 secciones (Construcción, Habilidades digitales, Capacitación
    básica, Emprendimiento) con las columnas Cursos | Inscripciones | Certificados. value = cursos por ruta (count de IDs,
    derivado del array); inscripciones = COUNT (sin DISTINCT) de fact_inscription con inscripcionDate < ''2026-10-01'' y plataforma
    1 (CPE) o 2 (Aprende); certificados = COUNT (sin DISTINCT) con advance = 100 AND certificationDate < ''2026-10-01'' y
    plataforma 1 o 2. Métrica ACUMULADA (sin límite inferior) replicando el patrón del panel Consultas_consejo_panel.sql (corte
    de negocio: hasta 2026-10-01). El total por sección y el total global se componen en la hoja (Slide 12) con fórmula =SUM.

    '
  formula: 'Por ruta: value = array_length(IDs cursos), inscripciones = COUNT(*) de fact_inscription WHERE inscripcionDate
    < ''2026-10-01'' AND plataforma IN (1,2) (acumulado, sin límite inferior), certificados = COUNT(*) WHERE advance = 100
    AND certificationDate < ''2026-10-01'', filtrado por México.'
  type: count
  source: fact_inscription
  platform_scope:
  - cpe
  - aprende
  db_mapping: "WITH rutas AS (\n  SELECT * FROM (VALUES\n  (1, 'Construcción', 'Proyectos constructivos y mantenimiento',\
    \ ARRAY[9,187,4,389,390,367,205,206,11,30,140,23,29,24,12,100157,244,240,27]::bigint[]),\n  (2, 'Habilidades digitales',\
    \ '¿Cómo utilizar un celular?', ARRAY[254,399]::bigint[]),\n  (3, 'Habilidades digitales', '¿Cómo utilizar la computadora?',\
