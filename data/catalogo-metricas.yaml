    ) AS RECORDS(orden, seccion, ruta, curso_ids) ) SELECT r.seccion, r.ruta, array_length(r.curso_ids, 1) AS value,\n   \
    \    COUNT(fi.\"userId\") FILTER (WHERE fi.\"inscripcionDate\" < '2026-10-01') AS inscripciones,\n       COUNT(fi.\"userId\"\
    ) FILTER (WHERE fi.advance = 100 AND fi.\"certificationDate\" < '2026-10-01') AS certificados,\n       'Acumulado' AS\
    \ periodo_inicio,\n       '2026-10-01' AS periodo_fin,\n       'fact_inscription' AS source\nFROM rutas r JOIN fact_inscription\
    \ fi ON fi.\"courseId\" = ANY(r.curso_ids) JOIN dim_user u ON u.\"userId\" = fi.\"userId\" JOIN dim_local l ON l.\"localId\"\
    \ = u.\"localId\" WHERE u.\"plataformaId\" IN (1,2)\n  AND l.\"countryName\" = 'México'\nGROUP BY r.orden, r.seccion,\
    \ r.ruta, r.curso_ids ORDER BY r.orden\n"
  caveats:
  - 'Layout del deck pasado por el usuario el 2026-10-07, con las 2 rutas que reafirmó después de ver la reconciliación de
    la baja (hallazgo H25): 18 rutas en 4 secciones (Construcción 1, Habilidades digitales 2-6, Capacitación básica 7-12,
    Emprendimiento 13-18) y 114 cursos. Las secciones ocupan órdenes consecutivos porque el bloque de la hoja emite un subtotal
    al detectar un cambio de sección.'
  - 'SALE una sola ruta respecto de la versión de 18 rutas anterior: "Convive mejor con otros" (6 cursos: 305, 100063, 100070,
    100330, 100380, 100381). Su curso 299 se queda en "¿Cómo mejorar mi entorno?".'
