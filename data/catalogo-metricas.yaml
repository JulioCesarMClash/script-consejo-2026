- key: slide13_penitenciarios_usuarios_registrados
  name: Slide 13 — Usuarios únicos registrados (Centros Penitenciarios)
  description: 'Métrica de Slide 13 ''Formación en Centros Penitenciarios'': total acumulado de usuarios registrados con gender
    1 (Mujer) o 2 (Hombre) y brand 16 (DETPCDMX) o 18 (CEFERESOS), con registrationDate < ''2026-10-01''. Replica el SP `SP_Capacitate_count_users_by_brand_age_gender`
    con la suma de los subqueries por género.'
  formula: 'COUNT(DISTINCT u.id) de capacitate_analisis.user JOIN userbrand JOIN brand WHERE brandId IN (16, 18) AND registrationDate
    < ''2026-10-01''.

    '
  type: count_distinct
  source: dim_user
  platform_scope: []
  db_source: mysql
  db_mapping: "      SELECT\n        (SELECT COUNT(DISTINCT u.id)\n         FROM capacitate_analisis.user u\n         INNER\
    \ JOIN capacitate_analisis.userbrand ub ON u.id = ub.userId\n         INNER JOIN capacitate_analisis.brand b ON ub.brandId\
    \ = b.id\n         INNER JOIN capacitate_analisis.person p ON p.userId = ub.userId\n         WHERE b.id IN (16, 18)\n\
    \           AND p.genderId = 1\n           AND u.registrationDate < '2026-10-01'\n        ) + (SELECT COUNT(DISTINCT u.id)\n\
    \         FROM capacitate_analisis.user u\n         INNER JOIN capacitate_analisis.userbrand ub ON u.id = ub.userId\n\
    \         INNER JOIN capacitate_analisis.brand b ON ub.brandId = b.id\n         INNER JOIN capacitate_analisis.person\
    \ p ON p.userId = ub.userId\n         WHERE b.id IN (16, 18)\n           AND p.genderId = 2\n           AND u.registrationDate\
    \ < '2026-10-01') AS value,\n             'Acumulado' AS periodo_inicio,\n             '2026-10-01' AS periodo_fin,\n\
    \             'dim_user' AS source"
  caveats:
  - Replica SP_Capacitate_count_users_by_brand_age_gender (excluye gender_id=3 'Otro' por defecto).
  - JOIN a person + gender para filtrar por género (1=Mujer, 2=Hombre).
  - Filtro por brand (brandId IN 16, 18).
  - Corte duro a '2026-10-01'.
