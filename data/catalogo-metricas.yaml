    \ ARRAY[142,299,364,348,100918]::bigint[]),\n  (11, 'Capacitación básica', 'Alimentos desde casa', ARRAY[410,282,241,33]::bigint[]),\n\
    \  (12, 'Capacitación básica', 'Actuar en caso de desastres naturales', ARRAY[387,100214,95,100098,120,314,354,281,57,393,276]::bigint[]),\n\
    \  (13, 'Emprendimiento', 'Planea tu negocio', ARRAY[93,100092,100149,157,156,158,100327]::bigint[]),\n  (14, 'Emprendimiento',\
    \ 'Planea los gastos y ganancias de tu negocio', ARRAY[169,159,167,100105]::bigint[]),\n  (15, 'Emprendimiento', '¿Cómo\
    \ preparar mis productos para venderlos?', ARRAY[100074,106,107,117,153,77]::bigint[]),\n  (16, 'Emprendimiento', 'Servicio\
