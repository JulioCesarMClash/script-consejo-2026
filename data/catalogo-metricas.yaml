- key: slide2_empleo_incluyente_por_sector
  name: Certificados por sector — empleo incluyente y convivencia (Slide 2)
  description: 'Personas certificadas en los 7 sectores (37 cursos) de la slide 2 (construcción y mantenimiento, limpieza
    y mantenimiento, transporte, alimentos y atención, agropecuarias, educación financiera y convive mejor con otros). Grano
    por curso: una persona certificada en dos cursos del mismo sector cuenta en ambos. Fuente original: PerfilesFemeninos.sql
    (período certificación septiembre a septiembre); el sector de convivencia lo declaró el usuario el 2026-10-05. Regla:
    advance = 100, único, plataforma 1 o 2.'
  formula: COUNT(DISTINCT fact_inscription.userId) POR CURSO en los 7 sectores, WHERE advance = 100 AND certificationDate
    en período AND plataformaId IN (1,2) AND Mexico.
  type: count_distinct
  source: fact_inscription
  platform_scope:
  - cpe
  - aprende
  db_mapping: "SELECT grupo, curso, COUNT(DISTINCT \"userId\") AS value,\n       %(period_start)s AS periodo_inicio,\n   \
    \    %(period_end)s AS periodo_fin,\n       'fact_inscription' AS source\nFROM (\n  SELECT fi.\"userId\", c.name AS curso,\n\
    \    CASE\n      WHEN fi.\"courseId\" IN (9,187,4,367,205,206,11,30,23,29,24,12) THEN 'Construcción y mantenimiento'\n\
    \      WHEN fi.\"courseId\" IN (6,57,8,100214,128) THEN 'Limpieza y mantenimiento'\n      WHEN fi.\"courseId\" IN (77,100310,41)\
    \ THEN 'Servicios en transporte'\n      WHEN fi.\"courseId\" IN (39,5,38,58) THEN 'Alimentos y atención'\n      WHEN fi.\"\
    courseId\" IN (52,33) THEN 'Actividades agropecuarias'\n      WHEN fi.\"courseId\" IN (100322,100128,100325) THEN 'Educación\
    \ financiera'\n      WHEN fi.\"courseId\" IN (100330,100380,100381,305,100070,100063,299,348) THEN 'Convive mejor con\
    \ otros'\n      ELSE NULL\n    END AS grupo\n  FROM public.fact_inscription fi\n  JOIN public.dim_user u ON u.\"userId\"\
    \ = fi.\"userId\"\n  JOIN public.dim_local l ON l.\"localId\" = u.\"localId\"\n  JOIN public.course c ON c.id = fi.\"\
    courseId\"\n  WHERE fi.advance = 100\n    AND fi.\"certificationDate\" >= %(period_start)s\n    AND fi.\"certificationDate\"\
    \ <= %(period_end)s\n    AND u.\"plataformaId\" IN (1,2)\n    AND l.\"countryName\" = 'México'\n) detalle WHERE grupo\
    \ IS NOT NULL GROUP BY grupo, curso ORDER BY grupo, curso ASC\n"
  athena_mapping: |
    SELECT grupo, curso, COUNT(DISTINCT user_id) AS value,
           %(period_start)s AS periodo_inicio,
           %(period_end)s AS periodo_fin,
           'fact_inscription' AS source
    FROM (
      SELECT fi.user_id, c.name AS curso,
        CASE
          WHEN fi.course_id IN (9,187,4,367,205,206,11,30,23,29,24,12) THEN 'Construcción y mantenimiento'
          WHEN fi.course_id IN (6,57,8,100214,128) THEN 'Limpieza y mantenimiento'
          WHEN fi.course_id IN (77,100310,41) THEN 'Servicios en transporte'
          WHEN fi.course_id IN (39,5,38,58) THEN 'Alimentos y atención'
          WHEN fi.course_id IN (52,33) THEN 'Actividades agropecuarias'
          WHEN fi.course_id IN (100322,100128,100325) THEN 'Educación financiera'
          WHEN fi.course_id IN (100330,100380,100381,305,100070,100063,299,348) THEN 'Convive mejor con otros'
          ELSE NULL
        END AS grupo
      FROM fact_inscription fi
      JOIN dim_user u ON u.user_id = fi.user_id
      JOIN course c ON c.course_id = fi.course_id
      WHERE fi.advance = 100
        AND fi.certification_date >= date(%(period_start)s)
        AND fi.certification_date <= date(%(period_end)s)
        AND u.plataforma_id IN (1,2)
        AND u.country_id = 'MX'
    ) detalle WHERE grupo IS NOT NULL GROUP BY grupo, curso ORDER BY grupo, curso ASC
  caveats:
  - 'Grano por curso: una persona en dos cursos del mismo sector cuenta en ambos.'
  - 'Regla certificación: advance = 100 AND certificationDate IS NOT NULL.'
  - 'Límite superior del período: INCLUSIVO (<=) para coincidir con Perfiles_Femeninos.sql original.'
  - 'Fuente original: Perfiles_Femeninos.sql (IDs exactos por sector).'
  - 'Orden de filas: alfabético por curso dentro de cada sector (no por valor DESC). El sheet repo emite un bloque con subtotales
    por sector y TOTAL general.'
  - 'Sector "Convive mejor con otros" agregado el 2026-10-05 con 8 cursos: 100330 (Actitud más humana), 100380 (Momentos significativos),
    100381 (El arte de acompañar), 305 (Prácticas de cortesía), 100070 (Juego limpio), 100063 (Solidaridad), 299 (Cultura
    urbana) y 348 (Seguridad para todas y todos). Slide 2 pasa de 6 a 7 sectores y de 30 a 37 cursos.'
  - El 348 (Seguridad para todas y todos) salió del sector el 2026-10-06 con la "lista de verdad" de 36 cursos y el usuario
    lo repuso el 2026-10-07. Es el curso que entró y salió, así que `test_slide2_includes_seguridad_para_todas` lo fija para
    que un cambio accidental rompa. El 2026-10-06 el sector también se renombró de "ConvivIR" a "ConvivE mejor con otros",
    unificándose con el nombre de la ruta de slide 12.
  - 'De los cursos con nombre duplicado en `course` se tomó el ID dominante y vivo: "Prácticas de cortesía" existe como 297/305/331/100109/100711/100907
    y se usa 305 (186,558 inscripciones contra 9,911 del siguiente, activo al 2026-10-04); "Solidaridad" existe como 100063/100704
    y se usa 100063 (43,920 contra 340). Mismos IDs que slide 12.'
  - 'Slide 2 agrupa por `c.name`, NO por `courseId`: dos IDs con el mismo nombre se fusionarían en una sola fila sumando los
    usuarios de ambos. Verificado el 2026-10-05 que ninguno de los 8 cursos nuevos choca de nombre con los 30 previos ni entre
    sí.'
  - 'El `CASE` toma la primera rama que coincide, así que un curso en dos sectores se asignaría en silencio al de arriba.
    Verificado: 38 cursos en 7 sectores, todos distintos.'
  - 'Lista final fijada por el usuario el 2026-10-05: 37 cursos en 7 sectores. Respecto de la versión anterior sale el curso
    27 (Reparador de aire acondicionado) de "Construcción y mantenimiento", que queda en 12 cursos.'
  - 'El 27 NO es un curso retirado: tiene 254,823 inscripciones y actividad al 2026-10-03. La exclusión es una decisión de
    negocio y coincide con la pestaña "Pobreza" de la hoja de control del usuario, que tampoco lo traía (hallazgo H3). Sigue
    contándose en slide 1 (vivienda) y en slide 12 ("Proyectos constructivos y mantenimiento"), así que las tres slides de
    pobreza ya NO comparten el mismo universo de construcción.'
  - 'El orden dentro de cada lista `IN` es irrelevante para la hoja: la SQL cierra con `ORDER BY grupo, curso ASC`, así que
    las filas salen alfabéticas por nombre de curso sin importar cómo esté escrito el IN.'
  - 'CUIDADO: el sector de slide 2 y la ruta de slide 12 ahora se llaman IGUAL pero NO tienen los mismos cursos. Slide 12
    incluye el 348 y slide 2 no. El nombre compartido invita a asumir que son la misma lista, así que `test_convivencia_sector_and_route_share_the_name`
    verifica explícitamente que difieren.'
  - 'El 348 se cuenta en las tres slides de pobreza: slide 1 (slide1_alimentos), slide 2 (Convive mejor con otros) y slide
    12 ("¿Cómo mejorar mi entorno?"). Son métricas separadas y no comparten total, así que no hay doble conteo.'
- key: slide21_pobreza_consolidada
  name: Personas beneficiadas por grupo — pobreza consolidada (slide nueva)
  description: 'Fusiona el universo de cursos de las slides 1 y 2 en 12 grupos, repartiendo cada curso en UN SOLO grupo para
    que las cifras no se inflen por cursos duplicados. 130 cursos únicos que miden las queries más 9 compartidos declarados
    = 139, el total que publica el deck. Distribución y asignación de los 9 duplicados fijadas por el usuario el 2026-10-12.
    Regla: advance = 100, período oficial de certificados, plataforma 1 o 2, México.'
  formula: 'Por grupo: value = array_length(IDs cursos), compartidos = literal declarado, cursos_totales = value + compartidos,
    certificaciones = COUNT(userId) y certificados = COUNT(DISTINCT userId), ambas WHERE advance = 100 AND certificationDate
    en período AND plataformaId IN (1,2) AND Mexico.'
  type: count_distinct
  source: fact_inscription
  platform_scope: *id001
  db_source: postgres
  db_mapping: "WITH grupos AS (\n  SELECT * FROM (VALUES\n  (1, 'Formación para mejorar tu vivienda',\n   ARRAY[9,187,4,389,390,367,11,205,206,30,140,23,29,24,12,100157,244,240,27]::bigint[],\
    \ 0),\n  (2, 'Desarrollo de habilidades digitales básicas',\n   ARRAY[254,399,213,258,285,379,43,321,374,375,100002,100006,394,380,100003,345,100897,368,372,100129,373]::bigint[],\
    \ 0),\n  (3, 'Alimentos desde casa, seguridad e higiene elemental',\n   ARRAY[33,241,282,410,103,145,242,362,382,128,129,130,141,347,89,291,100147,142,364,100900,100861,100918]::bigint[],\
    \ 4),\n  (4, 'Formación para actuar ante desastres naturales',\n   ARRAY[95,120,276,281,314,342,354,387,393,100098]::bigint[],\
    \ 1),\n  (5, 'Actívate para encontrar empleo',\n   ARRAY[100919,100928,228,100853,216,227,67,212,100059]::bigint[], 0),\n\
    \  (6, 'Crea tu propio empleo',\n   ARRAY[93,156,157,158,100092,100149,159,167,169,100105,106,107,117,153,100074,118,234,301,100101,100320,143,170,320,343,358,100327]::bigint[],\
    \ 2),\n  (7, 'Servicios de limpieza y mantenimiento',\n   ARRAY[6,57,8,100214]::bigint[], 1),\n  (8, 'Actividades agropecuarias',\n\
    \   ARRAY[52]::bigint[], 1),\n  (9, 'Servicios de alimentos y atención',\n   ARRAY[39,5,38,58]::bigint[], 0),\n  (10,\
    \ 'Educación financiera básica',\n   ARRAY[100322,100128,100325]::bigint[], 0),\n  (11, 'Servicios en transporte',\n \
    \  ARRAY[77,100310,41]::bigint[], 0),\n  (12, 'Convivir mejor con otros',\n   ARRAY[100330,100380,100381,305,100070,100063,299,348]::bigint[],\
    \ 0)\n) AS RECORDS(orden, grupo, curso_ids, compartidos) ) SELECT g.grupo,\n       array_length(g.curso_ids, 1) AS value,\n\
    \       g.compartidos,\n       array_length(g.curso_ids, 1) + g.compartidos AS cursos_totales,\n       (SELECT COUNT(fi.\"\
    userId\")\n          FROM fact_inscription fi\n          JOIN dim_user u  ON u.\"userId\"  = fi.\"userId\"\n         \
    \ JOIN dim_local l ON l.\"localId\" = u.\"localId\"\n         WHERE fi.\"courseId\" = ANY(g.curso_ids)\n           AND\
    \ fi.advance = 100\n           AND fi.\"certificationDate\" >= %(period_start)s\n           AND fi.\"certificationDate\"\
    \ < %(period_end)s\n           AND u.\"plataformaId\" IN (1,2)\n           AND l.\"countryName\" = 'México'\n       )\
    \ AS certificaciones,\n       (SELECT COUNT(DISTINCT fi.\"userId\")\n          FROM fact_inscription fi\n          JOIN\
    \ dim_user u  ON u.\"userId\"  = fi.\"userId\"\n          JOIN dim_local l ON l.\"localId\" = u.\"localId\"\n        \
    \ WHERE fi.\"courseId\" = ANY(g.curso_ids)\n           AND fi.advance = 100\n           AND fi.\"certificationDate\" >=\
    \ %(period_start)s\n           AND fi.\"certificationDate\" < %(period_end)s\n           AND u.\"plataformaId\" IN (1,2)\n\
    \           AND l.\"countryName\" = 'México'\n       ) AS certificados,\n       %(period_start)s AS periodo_inicio,\n\
    \       %(period_end)s AS periodo_fin,\n       'fact_inscription' AS source\nFROM grupos g ORDER BY g.orden\n"
  caveats:
  - 'Slide NUEVA, sin número asignado todavía: la key usa slide21 por ser el siguiente libre. Si el deck le da otro número,
    hay que renombrar la key y su rama en _build_slide_block.'
  - 'Los 130 cursos son exactamente la unión de slides 1 (114) y 2 (37): comparten 21, así que la unión da 130 distintos.
    `test_slide21_covers_the_universe_of_slides_1_and_2` fija ese acoplamiento — si una de las dos cambia su lista, esta slide
    queda desincronizada y el test lo marca.'
  - 'Los 9 cursos que estaban en dos grupos los asignó el usuario el 2026-10-12: 33 y 128 -> "Alimentos desde casa"; 57 y
    100214 -> "Servicios de limpieza y mantenimiento"; 77 y 100310 -> "Servicios en transporte"; 299 y 348 -> "Convivir mejor
    con otros"; 100322 -> "Educación financiera básica".'
  - El literal `compartidos` (4/1/2/1/1 = 9) registra los cursos que cada grupo CEDE a otro en la query pero sigue mostrando
    en el deck. Mismo modelo que slide 12 (114 únicos + 14 = 128) y que la columna `compartidos` de slide 1. No se puede derivar
    del SQL, así que `test_slide21_shared_courses_close_the_deck_total` lo fija.
  - 'Dos métricas por grupo a propósito: `certificaciones` es COUNT (suma exacta al total) y `certificados` es COUNT(DISTINCT
    userId) (personas, NO aditivo). La suma de la columna de personas da 291,349 contra 239,963 reales (+21.4%): ese inflado
    es estructural, porque una persona pertenece a todos los grupos donde certificó y ningún reparto de cursos lo arregla.
    Ver hallazgo H30.'
  - Si el deck publica una cifra de personas, el número honesto es el de personas únicas sobre los 130 cursos (239,963 al
    2026-10-12), que va como línea aparte y NO como suma de la columna.
  - '"Actividades agropecuarias" quedó con 1 solo curso (52, Granjero de lechería) porque su otro curso, el 33, se asignó
    a "Alimentos desde casa". Su fila muestra 2 cursos totales pero su cifra sale de 1.'
  - 'Resultado al 2026-10-12 (ventana 2025-09-01..2026-10-01): 130 cursos, 372,199 certificaciones y 291,349 en la suma de
    personas por grupo, sobre 239,963 personas únicas reales.'
- key: slide3_capacitate_carso
  name: Capacítate Carso — usuarios registrados por ventana fija (Slide 3)
  description: 'Usuarios únicos registrados en carso_analisis.user con registrationDate dentro de CUATRO ventanas de tiempo
    fijas. Devuelve UNA fila con cuatro columnas: "2025" ([2025-01-01, 2026-01-01)), "sep2026" ([2026-01-01, 2026-10-01)),
    "acumulado" ([2000-01-01, 2026-10-01), histórico completo desde 2000) y "base_dic2026" ([2026-10-01, 2027-01-01), solo
    base para proyección futura). Las ventanas son fijas (NO usan period_start/period_end) porque alimentan la tabla comparativa
    del slide 3, no una métrica del corte.

    '
  formula: 'COUNT(DISTINCT carso_analisis.user.id) por cada ventana fija de la tabla comparativa del slide 3.

    '
  type: count_distinct
  source: dim_user
  platform_scope: []
  db_source: mysql
  db_mapping: "SELECT\n  (SELECT COUNT(DISTINCT u.id) FROM carso_analisis.user u\n   WHERE u.registrationDate >= '2025-01-01'\
    \ AND u.registrationDate < '2026-01-01') AS \"2025\",\n  (SELECT COUNT(DISTINCT u.id) FROM carso_analisis.user u\n   WHERE\
    \ u.registrationDate >= '2026-01-01' AND u.registrationDate < '2026-10-01') AS \"sep2026\",\n  (SELECT COUNT(DISTINCT\
    \ u.id) FROM carso_analisis.user u\n   WHERE u.registrationDate >= '2000-01-01' AND u.registrationDate < '2026-10-01')\
    \ AS \"acumulado\",\n  (SELECT COUNT(DISTINCT u.id) FROM carso_analisis.user u\n   WHERE u.registrationDate >= '2026-10-01'\
    \ AND u.registrationDate < '2027-01-01') AS \"base_dic2026\"\n"
  caveats:
  - 'Ventanas FIJAS (ignoran period_start/period_end): tabla comparativa del slide 3 (columna 2025 y sep2026).'
  - La fila 'Capacitate Empleo' de la tabla es manual; esta métrica cubre solo Capacítate Carso.
  - base_dic2026 es SOLO base de cálculo para una proyección futura de dic2026; NO se escribe en el snapshot.
  - 'db_source mysql: ejecuta contra carso_analisis. MYSQL_DATABASE vacío → prefijo <db>.tabla requerido.'
  - source dim_user documenta el modelo conceptual; el dispatch real lo hace db_source.
- key: slide3_academica_labs
  name: Académica Labs — usuarios inscritos por ventana fija (Slide 3)
  description: 'Usuarios únicos que se inscribieron a al menos un curso en academica_analisis.userinscription con createdAt
    dentro de CUATRO ventanas de tiempo fijas. Devuelve UNA fila con cuatro columnas: "2025" ([2025-01-01, 2026-01-01)), "sep2026"
    ([2026-01-01, 2026-10-01)), "acumulado" ([2000-01-01, 2026-10-01), histórico completo desde 2000) y "base_dic2026" ([2026-10-01,
    2027-01-01), solo base para proyección futura). Reemplaza la fila Académica.org. 2025 suele ser 0 porque la tabla arrancó
    el 2026-01-15 (no es un error de extracción).

    '
  formula: 'COUNT(DISTINCT academica_analisis.userinscription.userId) por cada ventana fija de la tabla comparativa del slide
    3.

    '
  type: count_distinct
  source: dim_user
  platform_scope: []
  db_source: mysql
  db_mapping: "SELECT\n  (SELECT COUNT(DISTINCT ui.userId) FROM academica_analisis.userinscription ui\n   WHERE ui.createdAt\
    \ >= '2025-01-01' AND ui.createdAt < '2026-01-01') AS \"2025\",\n  (SELECT COUNT(DISTINCT ui.userId) FROM academica_analisis.userinscription\
    \ ui\n   WHERE ui.createdAt >= '2026-01-01' AND ui.createdAt < '2026-10-01') AS \"sep2026\",\n  (SELECT COUNT(DISTINCT\
    \ ui.userId) FROM academica_analisis.userinscription ui\n   WHERE ui.createdAt >= '2000-01-01' AND ui.createdAt < '2026-10-01')\
    \ AS \"acumulado\",\n  (SELECT COUNT(DISTINCT ui.userId) FROM academica_analisis.userinscription ui\n   WHERE ui.createdAt\
    \ >= '2026-10-01' AND ui.createdAt < '2027-01-01') AS \"base_dic2026\"\n"
  caveats:
  - No existía definición previa (ni SP ni query original); se define como usuarios únicos inscritos por createdAt, semejante
    al conteo de Carso.
  - 'Ventanas FIJAS (ignoran period_start/period_end): tabla comparativa del slide 3 (columna 2025 y sep2026).'
  - '2025 = 0 es CORRECTO: academica_analisis.userinscription arrancó el 2026-01-15.'
  - La fila 'Capacitate Empleo' de la tabla es manual; esta métrica cubre solo Académica Labs.
  - base_dic2026 es SOLO base de cálculo para una proyección futura de dic2026; NO se escribe en el snapshot.
  - 'db_source mysql: ejecuta contra academica_analisis. MYSQL_DATABASE vacío → prefijo <db>.tabla requerido.'
  - source dim_user documenta el modelo conceptual; el dispatch real lo hace db_source.
- key: slide4_aprende_seguridad_vial
  name: Aprende de seguridad vial — personas únicas certificadas por ventana fija (Slide 4)
  description: 'Personas únicas certificadas (advance = 100) en los 16 cursos de seguridad vial, por ventana fija: "2025"
    ([2025-01-01, 2026-01-01)), "sep2026" ([2026-01-01, 2026-10-01)) y "dic2026" ([2026-01-01, 2027-01-01)). Ejecuta contra
    PostgreSQL `public.fact_inscription` (query original de Consultas_consejo_panel.sql con las ventanas del período actual).
    El acumulado histórico (< ''2026-10-01'') vive en la métrica hermana slide4_aprende_seguridad_vial_acumulado (MySQL);
    esta métrica NO devuelve acumulado. Restaura la tabla comparativa de la hoja Datos con las ventanas del período actual
    (2025/sep2026/dic2026), antes degradadas a un solo valor acumulado.

    '
  formula: 'COUNT(DISTINCT fact_inscription.userId) con advance = 100 y certificationDate en la ventana fija, para los 16
    cursos de seguridad vial.

    '
  type: count_distinct
  source: fact_inscription
  platform_scope: []
  db_source: postgres
  db_mapping: "SELECT\n  (SELECT COUNT(DISTINCT i.\"userId\") FROM public.fact_inscription i\n   WHERE i.\"courseId\" IN (80,79,352,351,305,100156,100326,175,54,41,202,98,203,204,36,114)\n\
    \     AND i.advance = 100\n     AND i.\"certificationDate\" >= '2025-01-01' AND i.\"certificationDate\" < '2026-01-01')\
    \ AS \"2025\",\n  (SELECT COUNT(DISTINCT i.\"userId\") FROM public.fact_inscription i\n   WHERE i.\"courseId\" IN (80,79,352,351,305,100156,100326,175,54,41,202,98,203,204,36,114)\n\
    \     AND i.advance = 100\n     AND i.\"certificationDate\" >= '2026-01-01' AND i.\"certificationDate\" < '2026-10-01')\
    \ AS \"sep2026\",\n  0 AS \"dic2026\"\n"
  caveats:
  - 'Ventanas FIJAS (ignoran period_start/period_end): tabla comparativa del slide 4, ahora con el período 2025/sep2026/dic2026.'
  - 'El acumulado histórico (< ''2026-10-01'') NO está acá: lo provee la métrica hermana slide4_aprende_seguridad_vial_acumulado
    (MySQL), que se fusiona en la misma fila de la hoja con fuente ''postgres + mysql''.'
  - 'Vuelve a PostgreSQL (2026-08-14) con la query original de HEAD: las 3 ventanas fijas del período actual, sin acumulado.'
  - 'db_source postgres: ejecuta contra analisis_cpe_db. Columnas camelCase requieren comillas dobles.'
  - source fact_inscription documenta el modelo conceptual; el dispatch real lo hace db_source.
- key: slide4_aprende_seguridad_vial_acumulado
  name: Aprende de seguridad vial — acumulado histórico (Slide 4)
  description: 'Acumulado histórico de personas únicas certificadas (advance = 100) en los 16 cursos de seguridad vial, con
    corte < ''2026-10-01''. Métrica HERMANA de slide4_aprende_seguridad_vial: no genera fila propia en la hoja, su valor se
    fusiona en la columna "Acumulado sep2026" de la fila de seguridad vial (fuente "postgres + mysql"). Ejecuta contra MySQL
    `capacitate_analisis` (query CT que el usuario validó, 207,562).

    '
  formula: 'COUNT(DISTINCT inscription.userId) de capacitate_analisis.inscription JOIN course WHERE course.id IN (16 IDs)
    AND advance = 100 AND certificationDate < ''2026-10-01''.

    '
  type: count_distinct
  source: fact_inscription
  platform_scope: []
  db_source: mysql
  db_mapping: "SELECT COUNT(DISTINCT i.userId) AS value,\n       'Acumulado' AS periodo_inicio,\n       '2026-10-01' AS periodo_fin,\n\
    \       'inscription' AS source\nFROM capacitate_analisis.inscription i JOIN capacitate_analisis.course c ON i.courseId\
    \ = c.id WHERE c.id IN (80, 79, 352, 351, 305, 100156, 100326, 175, 54,\n               41, 202, 98, 203, 204, 36, 114)\n\
    \  AND i.advance = 100\n  AND i.certificationDate < '2026-10-01'\n"
  caveats:
  - Misma lista de 16 cursos que slide19_seguridad_vial_personas_certificadas_unicas.
  - Se fusiona con la métrica base slide4_aprende_seguridad_vial en la fila de la hoja; sin ella NO tiene fila propia.
  - 'MySQL: coincide con la query CT del usuario (207,562).'
- key: slide4_cultura_salud_aprende
  name: Cultura y Salud Aprende (registros) — usuarios sin inscripción por ventana fija (Slide 4)
  description: 'Usuarios de la plataforma Aprende (plataformaId = 2) registrados dentro de cada ventana fija y SIN ninguna
    inscripción (NOT EXISTS fact_inscription). Devuelve UNA fila con cuatro columnas: "2025" ([2025-01-01, 2026-01-01)), "sep2026"
    ([2026-01-01, 2026-10-01)), "dic2026" ([2026-01-01, 2027-01-01)) y "acumulado" (histórico < 2026-10-01).

    '
  formula: 'COUNT(DISTINCT dim_user.userId) con plataformaId = 2, registrationDate en la ventana y NOT EXISTS fact_inscription
    del mismo usuario.

    '
  type: count_distinct
  source: dim_user
  platform_scope: []
  db_source: postgres
  db_mapping: "SELECT\n  (SELECT COUNT(DISTINCT u.\"userId\") FROM public.dim_user u\n   WHERE u.\"plataformaId\" = 2\n  \
    \   AND u.\"registrationDate\" >= '2025-01-01' AND u.\"registrationDate\" < '2026-01-01'\n     AND NOT EXISTS (SELECT\
    \ 1 FROM public.fact_inscription fi WHERE fi.\"userId\" = u.\"userId\")) AS \"2025\",\n  (SELECT COUNT(DISTINCT u.\"userId\"\
    ) FROM public.dim_user u\n   WHERE u.\"plataformaId\" = 2\n     AND u.\"registrationDate\" >= '2026-01-01' AND u.\"registrationDate\"\
    \ < '2026-10-01'\n     AND NOT EXISTS (SELECT 1 FROM public.fact_inscription fi WHERE fi.\"userId\" = u.\"userId\")) AS\
    \ \"sep2026\",\n  0 AS \"dic2026\",\n  (SELECT COUNT(DISTINCT u.\"userId\") FROM public.dim_user u\n   WHERE u.\"plataformaId\"\
    \ = 2\n     AND u.\"registrationDate\" < '2026-10-01'\n     AND NOT EXISTS (SELECT 1 FROM public.fact_inscription fi WHERE\
    \ fi.\"userId\" = u.\"userId\")) AS \"acumulado\"\n"
  caveats:
  - 'Definición operativa del usuario: registrados Aprende SIN inscripción, NO iguala la lámina vieja (1,318,962/95,801/452,949/480,611).'
  - 'Ventanas FIJAS (ignoran period_start/period_end): tabla comparativa del slide 4.'
  - acumulado es TODO el histórico con registrationDate < 2025-10-01 (desde 2014).
  - 'db_source postgres: ejecuta contra analisis_cpe_db. Columnas camelCase requieren comillas dobles.'
  - source dim_user documenta el modelo conceptual; el dispatch real lo hace db_source.
- key: slide20_crecimiento_integral_cursos_ofertados
  name: Slide 20 — Cursos ofertados (crecimiento integral)
  description: 'Métrica de Slide 20: cursos distintos con al menos una inscripción. 46 mantenidos (<2026-10-01) + 27 quitados
    (<2026-06-01) = 73.'
  formula: COUNT(DISTINCT fact_inscription.courseId) WHERE courseId IN (85 cursos originales) AND inscripcionDate >= '2025-04-03'
    AND < '2026-10-01', dim_user.plataformaId = 2.
  type: count_distinct
  source: fact_inscription
  platform_scope:
  - aprende
  db_source: postgres
  db_mapping: "      SELECT COUNT(DISTINCT fi.\"courseId\") AS value,\n             '2025-04-03' AS periodo_inicio,\n    \
    \         '2026-10-01' AS periodo_fin,\n             'fact_inscription' AS source\n      FROM fact_inscription fi\n  \
    \    JOIN course c ON c.\"id\" = fi.\"courseId\"\n      JOIN dim_user du ON du.\"userId\" = fi.\"userId\"\n      WHERE\
    \ du.\"plataformaId\" = 2\n        AND fi.\"courseId\" IN (100109,100330,100331,100337,100338,100339,100340,100341,100342,100343,100344,100345,100346,100347,100348,100349,100350,100351,100352,100353,100354,100355,100356,100357,100358,100359,100360,100362,100364,100365,100366,100367,100369,100371,100374,100377,100378,100379,100380,100381,100382,100384,100386,100387,100388,100389,100390,100396,100397,100399,100659,100660,100695,100696,100697,100698,100699,100700,100701,100702,100703,100704,100705,100706,100707,100708,100709,100710,100712,100713,100714,100715,100716,100717,100718,100719,100722,100723,100724,100725,100854,100855,100856,100857,100858)\n\
    \        AND fi.\"inscripcionDate\" >= '2025-04-03'\n        AND fi.\"inscripcionDate\" < '2026-10-01'"
  caveats:
  - A diferencia de inscripciones (que se parte en el cambio de cursos del 2026-06-01), esta métrica usa UNA sola ventana
    con los 85 cursos originales en [2025-04-03, 2026-10-01), tal cual la query declarada por el usuario el 2026-10-02.
  - El corte se alineó el 2026-10-05 con el resto de la corrida. Había quedado en '2026-08-01' siguiendo la query al pie de
    la letra; el usuario lo corrigió al revisar la hoja del snapshot, donde la divergencia quedaba a la vista.
  - El universo incluye los 32 cursos retirados el 2026-06-01, a diferencia de la cohorte vigente que usa inscripciones. Esa
    sigue siendo la diferencia de fondo entre las dos métricas, no la fecha.
  - 'Cursos ofertados: cuántos de los 85 cursos tuvieron al menos una inscripción en la ventana. Comparte universo y ventana
    con personas únicas.'
notes:
- key: certification_rule
  description: 'Regla oficial de certificación: certificationDate IS NOT NULL AND advance = 100. Usar solo certificationDate
    sobrecuenta certificaciones. Evidencia: en fact_inscription ~56M filas tienen certificationDate no nula, pero solo ~12M
    tienen advance = 100.

    '
- key: cumulative_warning
  description: 'Los acumulados (agg_*_month_cum) suman totales mensuales, NO cuentan únicos históricos reales. Para obtener
    únicos históricos verdaderos, usar DISTINCT sobre todo el período, no sumar agregados mensuales.

    '
- key: manual_metrics
  description: 'Las métricas marcadas como source: manual (Beneficiarios) se calculan con DISTINCT directo sobre fact_inscription
    y se ponen a mano en los reportes. No usan tablas agregadas ni MV. En las slides actuales, "Usuarios registrados" de Capacítate
    equivale a Beneficiarios.

    '
- key: source_model
  description: "Tres fuentes en el catálogo: - dim_user: COUNT DISTINCT sobre dim_user (registrados). Automático. - fact_inscription:\
    \ consulta directa sobre fact_inscription,\n  sin pasar por agg_* ni MV. Incluye inscripciones,\n  inscritos únicos, certificados,\
    \ certificados únicos y\n  beneficiarios únicos derivados.\n- manual: DISTINCT directo sobre fact_inscription, se pone\n\
    \  a mano en reportes. Incluye beneficiarios.\nIndependiente de la fuente conceptual, `db_source` selecciona la conexión:\
    \ \"postgres\" (default, analisis_cpe_db) o \"mysql\" (carso_analisis / academica_analisis). En MySQL las queries usan\
    \ prefijo <db>.tabla porque MYSQL_DATABASE suele estar vacío.\n"
- key: slide_naming
  description: 'En las slides del reporte FCS, "Usuarios registrados" de Capacítate para el Empleo corresponde conceptualmente
    a Beneficiarios (Registrados CPE + Inscritos únicos CPE desde Aprende). Se mantiene ese nombre en la presentación por
    ahora, pero el concepto real es Beneficiarios. Lo mismo aplica a la fila de Capacítate en la tabla comparativa (Slide
    3).

    '
- key: snapshot_validation
  description: 'Las tablas analytics_snapshot_course_metric y analytics_snapshot_user_metric existen desde abril 2026. Solo
    para validar comportamiento de cifras, no para histórico completo.

    '
