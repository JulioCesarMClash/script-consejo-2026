    212, 216, 227, 228, 100059 y 100853, y suma 100919 (Comienza a ganar con tus habilidades) y 100928 (Busca tu primer trabajo).
    Va al final de Emprendimiento para no partir la sección.'
  - La ruta "Compras y pagos digitales" (373 Regulación de la interacción digital y 100129 Manejo correcto de las tarjetas
    de crédito) vuelve al catálogo tras el revert del hallazgo H10. Va en Habilidades digitales, después de "Interacción con
    el mundo digital", que es donde la ubica el layout del deck. El 373 sale de "Interacción con el mundo digital", que queda
    en 8 cursos.
  - 'ENTRAN 4 cursos: 77 (Bodeguero) en "¿Cómo preparar mis productos para venderlos?", 205 (Guía de autoconstrucción) y 206
    (Guía de reparación vivienda rural) en "Proyectos constructivos y mantenimiento", y 100214 (Controlador de plagas en espacios
    urbanos) en "Actuar en caso de desastres naturales".'
  - 'Reparto: 114 asignaciones sobre 114 cursos distintos, cero compartidos. El TOTAL de la hoja (suma de subtotales por sección)
    es exactamente el total de los cursos de la slide, sin inflarse.'
  - 'Métrica ACUMULADA: sin límite inferior, corte < ''2026-10-01''. El resto del script usa la ventana 2025-09-01..2026-10-01
    vía .env; slide 12 no.'
  - 'ATENCIÓN para quien compare cifras: los certificados de slide 12 son CERTIFICACIONES (COUNT sin DISTINCT), no personas.
    Slides 1 y 2 sí cuentan COUNT(DISTINCT userId).'
  - 'Diferencias de redacción entre el deck y el catálogo, sin resolver: el deck dice "¿Cómo puedo mejorar mi entorno?" y
    "Planea los gastos y ganancia de tu negocio" (singular); el catálogo mantiene "¿Cómo mejorar mi entorno?" y "...ganancias..."
    (plural), que es como el usuario las nombró al pasar los cursos con sus IDs.'
  - El total de 118 cursos que muestra la slide física corresponde al modelo viejo de 102 distintos + 16 apariciones repetidas
    (hallazgo H7). Con este layout son 114 cursos sin repetir.
